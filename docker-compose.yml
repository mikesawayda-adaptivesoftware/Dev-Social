# Dev Social — LOCAL build of the single container (Next.js app + Socket.IO
# game server). This is a dev-machine convenience, not the deploy path.
#
#   1. cp .env.docker.example .env   # then paste your service_role key
#   2. npm run docker:local          # docker compose up --build
#
# Production is built by CI and delivered to Unraid by Watchtower — see
# infra/docker-compose.yml and QUICK_DEPLOY.md. Nothing here is used in prod;
# the values below are duplicated from the repo's GitHub Variables so a local
# build resembles the real one.

services:
  devsocial:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* are inlined into the browser bundle at BUILD time.
        # These are public/non-secret values.
        NEXT_PUBLIC_GAME_SERVER_URL: "https://dev-social.adaptivesoftware.co"
        NEXT_PUBLIC_SUPABASE_URL: "https://dlfjcxnnmtkzupvhdivw.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_BKDF8Jx85S4jPZy7UUembg_vQK2GW6g"
        # Browser key for the Real GeoGuessr game (Street View + guess map).
        # Read from your shell/.env at build time; restrict it by HTTP referrer
        # in the Google Cloud Console. Empty by default (GeoGuessr shows a setup
        # hint until it's provided).
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}"
        # Falls back to "DEMO_MAP_ID" in src/lib/googleMaps.ts when unset.
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: "${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}"
        BUILD_SHA: "local"
    image: devsocial:latest
    container_name: devsocial
    restart: unless-stopped
    ports:
      - "3000:3000" # Next.js app  (nginx: location / )
      - "3001:3001" # Socket.IO    (nginx: location /socket.io/ )
    environment:
      NODE_ENV: production
      # Lock CORS on the realtime server to your public origin (was "*").
      GAME_CLIENT_ORIGIN: "https://dev-social.adaptivesoftware.co"
      # Server-side Supabase access (writes + photo uploads).
      SUPABASE_URL: "https://dlfjcxnnmtkzupvhdivw.supabase.co"
      # Optional: unrestricted key so the server can resolve GeoGuessr panorama
      # ids at runtime. Not needed if you pre-bake panoIds in geoLocations.ts.
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
    # The service_role secret is injected at runtime from .env (copy from
    # .env.docker.example). Kept out of `environment:` so `docker compose build`
    # doesn't require the secret to be present.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # node, not wget — node is the runtime so it is guaranteed present, and it
      # has global fetch on 22. 127.0.0.1 rather than localhost because the
      # server binds 0.0.0.0 (IPv4 only) and localhost can resolve to ::1 first.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
