name: CI

# The gate. Called two ways:
#   - directly, on every pull request
#   - as a reusable job from deploy.yml, which publishes only if this passes
#
# Keeping it reusable rather than copy-pasted is what guarantees the checks that
# run on a PR are byte-identical to the ones that guard a release.

on:
  pull_request:
  workflow_call:

jobs:
  verify:
    name: Lint, build, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Placeholder values, not secrets. src/lib/supabaseClient.ts degrades to a
      # null client when these are unset, so the build would succeed either way —
      # but a build with them set exercises the same code path production does.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GAME_SERVER_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_TELEMETRY_DISABLED: '1'

      # After the build, not before: next-env.d.ts and .next/types/** are
      # gitignored and generated by `next build`, so running this first fails on
      # missing types rather than on real ones.
      #
      # This is the only thing that typechecks server/. `next build` covers src/
      # only, and the game server is executed straight from TypeScript by tsx —
      # so without this step a type error in server/rooms.ts is a runtime crash
      # in production, discovered by players.
      - name: Typecheck (includes server/)
        run: npx tsc --noEmit
